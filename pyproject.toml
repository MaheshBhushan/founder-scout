[project]
name = "founder-scout"
version = "0.1.0"
description = "Discord bot that finds startup founders and their publicly listed emails via Exa and Firecrawl"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4", "httpx>=0.27", "python-dotenv>=1.0", "anthropic>=0.80"]

[project.scripts]
founder-scout = "founder_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
